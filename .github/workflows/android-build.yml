name: Android Build

# Builds a Play-ready Android App Bundle (.aab) on every push that touches
# mobile/Android files, plus a manual "Run workflow" button. It always produces
# a downloadable .aab artifact; it only uploads to Google Play when the Play
# service-account + keystore secrets are configured.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-build.yml'
      - 'app/**'
      - 'assets/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'scripts/build-mobile-www.js'
      - 'android/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A signed bundle needs the upload keystore. Without it we still build an
      # unsigned bundle so the workflow proves the project compiles.
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Build mobile web assets
        run: npm run build:www

      - name: Add or sync Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Decode upload keystore
        if: ${{ env.HAS_SIGNING == 'true' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 --decode > $RUNNER_TEMP/upload.keystore
          echo "keystore size: $(wc -c < $RUNNER_TEMP/upload.keystore) bytes"

      - name: Build release bundle (.aab)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.HAS_SIGNING == 'true' && format('{0}/upload.keystore', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          # Google Play rejects a bundle whose versionCode was used before. The
          # monotonically-increasing GitHub run number guarantees a unique,
          # higher versionCode on every build. versionName stays 1.0.
          ./gradlew bundleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0 \
            --no-daemon --stacktrace

      - name: Upload .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: AjentSignals-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload to Google Play (internal testing)
        if: ${{ env.HAS_SIGNING == 'true' && env.HAS_PLAY == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.AjMore.ajentsignals
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
