name: Tests

# Fast invariant tests for the critical worker logic — runs on every push so a
# change that breaks an exit rule, an adaptive bound, or (importantly) leaks the
# strategy recipe into the public payload fails CI before it ships.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run invariant tests
        run: node worker/test/unit.mjs
