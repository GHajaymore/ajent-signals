name = "ajent-signals-worker"
main = "src/index.js"
compatibility_date = "2024-09-23"

# The 24/7 loop — runs every 15 minutes whether or not anyone's app is open.
[triggers]
crons = ["*/15 * * * *"]

# KV store for signals + the paper record.
# Create it once:  wrangler kv namespace create AJENT_KV
# then paste the id below.
[[kv_namespaces]]
binding = "AJENT_KV"
id = "REPLACE_WITH_KV_ID"

[vars]
DATA_PROVIDER = "yahoo"   # or "twelvedata"
RISK_DOLLARS = "250"
# Stripe price IDs for the two plans (create them in the Stripe dashboard).
# Public identifiers, safe to keep here; the SECRET key is a wrangler secret below.
STRIPE_PRICE_MONTHLY = "price_REPLACE_MONTHLY"
STRIPE_PRICE_ANNUAL  = "price_REPLACE_ANNUAL"

# Secrets (not in this file) — set with wrangler:
#   wrangler secret put DATA_API_KEY          # only if DATA_PROVIDER=twelvedata
#   wrangler secret put PRO_SECRET            # signs Pro tokens; unset = gate open
#   wrangler secret put STRIPE_SECRET_KEY     # sk_live_… (web payments)
#   wrangler secret put STRIPE_WEBHOOK_SECRET # whsec_… (verifies Stripe webhooks)
#   wrangler secret put APPLE_SHARED_SECRET   # App Store receipt validation (later)
#   wrangler secret put GOOGLE_SA_JSON        # Play service-account JSON (later)
