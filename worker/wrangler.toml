name = "ajent-signals-worker"
main = "src/index.js"
compatibility_date = "2024-09-23"

# The 24/7 loop — every 5 minutes whether or not anyone's app is open, so trade
# entries/exits (esp. 24/7 crypto) are caught within ~5m instead of 15m. One
# batched KV write per tick = ~288/day, well under the 1,000/day free limit.
# The production client currently calls the *.workers.dev URL, so keep it alive.
# (Adding a route otherwise disables it.) Do NOT remove until the branded domain
# below actually resolves and the client has been switched to it.
workers_dev = true

# Two crons: the 24/7 5-minute loop (signals + records), and a dedicated DAILY tick
# for the stock scan — it fetches ~40 names and would blow the 5-min loop's 50-
# subrequest free-tier budget if it shared a tick. 22:10 UTC = after the US close.
[triggers]
crons = ["*/2 * * * *", "10 22 * * *"]

# Branded API endpoint — READY BUT NOT YET LIVE. ajailabs.app DNS is still
# authoritative on GoDaddy (ns*.domaincontrol.com), so this Worker custom domain
# cannot resolve until the GoDaddy→Cloudflare DNS migration completes and the zone
# activates on Cloudflare. First-level subdomain so the free *.ajailabs.app
# Universal SSL cert will cover it (a deeper api.ajent.ajailabs.app would need the
# paid Advanced Certificate Manager). Once it resolves: point app/index.html + sw.js
# at https://ajent-api.ajailabs.app and retire the personal workers.dev URL.
[[routes]]
pattern = "ajent-api.ajailabs.app"
custom_domain = true

# KV store for signals + the paper record.
# Create it once:  wrangler kv namespace create AJENT_KV
# then paste the id below.
[[kv_namespaces]]
binding = "AJENT_KV"
id = "422c04e36c574a6f831151c871bce2c0"

[vars]
DATA_PROVIDER = "yahoo"   # or "twelvedata"
RISK_DOLLARS = "250"
# Web-push VAPID public key (safe to expose; the private JWK is a wrangler secret).
VAPID_PUBLIC = "BA2xDY7G-opfJAtm7hBYwKbwVBXm_kDtHzQatocdRvW2RfPe9O3xb7Z-F4td3fIyrb_ED2z1WxoEliI0CujwUDw"
VAPID_SUBJECT = "mailto:admin@ajailabs.app"
# Stripe price IDs for the two plans (create them in the Stripe dashboard).
# Public identifiers, safe to keep here; the SECRET key is a wrangler secret below.
STRIPE_PRICE_MONTHLY = "price_REPLACE_MONTHLY"
STRIPE_PRICE_ANNUAL  = "price_REPLACE_ANNUAL"

# Secrets (not in this file) — set with wrangler:
#   wrangler secret put DATA_API_KEY          # only if DATA_PROVIDER=twelvedata
#   wrangler secret put PRO_SECRET            # signs Pro tokens; unset = gate open
#   wrangler secret put STRIPE_SECRET_KEY     # sk_live_… (web payments)
#   wrangler secret put STRIPE_WEBHOOK_SECRET # whsec_… (verifies Stripe webhooks)
#   wrangler secret put APPLE_SHARED_SECRET   # App Store receipt validation (later)
#   wrangler secret put GOOGLE_SA_JSON        # Play service-account JSON (later)
